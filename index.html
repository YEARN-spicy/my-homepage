<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            max-width: 720px;
            margin: 60px auto;
            padding: 0 24px;
            color: #222;
            line-height: 1.6;
        }
        nav {
            margin-bottom: 48px;
        }
        nav a {
            margin-right: 20px;
            color: #555;
            text-decoration: none;
        }
        nav a:hover {
            color: #000;
        }
        h1 {
            font-size: 48px;
            margin: 24px 0;
        }
        .intro {
            font-size: 18px;
            color: #444;
            margin-bottom: 32px;
        }
        .info-line {
            color: #666;
            margin-bottom: 12px;
        }
        section {
            margin: 48px 0;
        }
        h2 {
            font-size: 22px;
            margin-bottom: 16px;
            border-left: 4px solid #333;
            padding-left: 12px;
        }
        .skill-tag {
            display: inline-block;
            padding: 6px 12px;
            background: #f3f3f3;
            border-radius: 999px;
            margin: 6px 8px 6px 0;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#about">关于</a>
        <a href="#skill">技能</a>
        <a href="#project">项目</a>
        <a href="#contact">联系</a>
    </nav>

    <div>
        <p>你好，我是</p>
        <h1>你的名字。</h1>
        <p class="intro">一句话介绍自己：你的职业 / 在做什么 / 热衷于什么。用一两句话让人快速认识你。</p>
        <p class="info-line">📍 所在城市</p>
        <p class="info-line"><a href="#project">查看项目 ↓</a></p>
        <p class="info-line"><a href="#contact">联系我</a></p>
    </div>

    <section id="about">
        <h2>关于</h2>
        <p>这里写一段简短的自我介绍：你是谁、目前在做的事情、关注的方向。两三句即可，保持克制。</p>
        <br>
        <p>可以补充一段经历或兴趣：正在学习什么、对什么领域好奇、业余喜欢做什么。</p>
    </section>

    <section id="skill">
        <h2>技能</h2>
        <span class="skill-tag">技能一</span>
        <span class="skill-tag">技能二</span>
        <span class="skill-tag">技能三</span>
    </section>

    <section id="project">
        <h2>项目</h2>
        <p>这里放你的项目介绍。</p>
    </section>

    <section id="contact">
        <h2>联系</h2>
        <p>邮箱：your@email.com</p>
    </section>
</body>
</html>
